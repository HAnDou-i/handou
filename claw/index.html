<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI自习室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <main class="layout">
    <section class="hero-panel glass-panel">
      <div class="hero-copy">
        <span class="eyebrow">U-CLAW WORKSPACE</span>
        <h1>AI 自习室</h1>
        <p>一个基于 AI 的自习室，提供智能导航、工具推荐和学习资源。</p>
      </div>

      <section class="time-section" aria-label="当前时间">
        <div id="clockTime" class="clock-panel__time" role="timer" aria-live="polite">
          <span class="time-num">00</span>
          <span class="colon">:</span>
          <span class="time-num">00</span>
          <span class="colon seconds-colon">:</span>
          <span class="time-num seconds-part">00</span>
        </div>
        <div id="clockDate" class="clock-panel__date">0000年00月00日 星期一</div>
      </section>
    </section>

    <section class="nav-section glass-panel">
      <div class="section-head">
        <div>
          <span class="section-kicker">Primary</span>
          <h2>快速导航</h2>
          <p></p>
        </div>
      </div>

      <div id="navGrid" class="nav-grid"></div>
    </section>

    <section class="tools-section glass-panel">
      <div class="section-head section-head--tools">
        <div>
          <span class="section-kicker">Utility</span>
          <h2>实用小工具</h2>
          <p>以下链接来自第三方站点，仅作导航整理，与本站无直接关联。</p>
        </div>
      </div>

      <div id="toolsGrid" class="tools-grid"></div>
    </section>
  </main>

  <template id="navCardTemplate">
    <div class="nav-card nav-card--primary">
      <div class="nav-card__icon"></div>
      <div class="nav-card__content">
        <h3 class="nav-card__title"></h3>
        <p class="nav-card__description"></p>
        <div class="nav-card__actions"></div>
      </div>
    </div>
  </template>

  <template id="toolCardTemplate">
    <a class="nav-card tool-link-card" target="_blank" rel="noopener noreferrer">
      <div class="nav-card__icon"></div>
      <div class="nav-card__content">
        <h3 class="nav-card__title"></h3>
        <p class="nav-card__description"></p>
      </div>
      <span class="nav-card__action"></span>
    </a>
  </template>

  <script src="app.js"></script>
</body>
</html>
