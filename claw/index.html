<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI自习室</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-bg"></div>

  <main class="layout">
    <section class="top-row">
      <section class="time-section">
        <div id="clockTime" class="clock-panel__time">00:00:00</div>
        <div id="clockDate" class="clock-panel__date">0000年00月00日 星期一</div>
      </section>
    </section>

    <section class="nav-section glass-panel">
      <div class="section-head">
        <div>
          <h2>快速导航</h2>
        </div>
      </div>

      <div id="navGrid" class="nav-grid"></div>
    </section>

    <div class="section-divider" aria-hidden="true"></div>

    <section class="tools-section glass-panel">
      <div class="section-head section-head--tools">
        <div>
          <h2>实用小工具</h2>
        </div>
      </div>

      <div id="toolsGrid" class="tools-grid"></div>
    </section>
  </main>

  <template id="navCardTemplate">
    <a class="nav-card" target="_blank" rel="noopener noreferrer">
      <div class="nav-card__icon"></div>
      <div class="nav-card__content">
        <h3 class="nav-card__title"></h3>
        <p class="nav-card__description"></p>
      </div>
      <span class="nav-card__action"></span>
    </a>
  </template>

  <template id="toolCardTemplate">
    <a class="nav-card tool-link-card" target="_blank" rel="noopener noreferrer">
      <div class="nav-card__icon"></div>
      <div class="nav-card__content">
        <h3 class="nav-card__title"></h3>
        <p class="nav-card__description"></p>
      </div>
      <span class="nav-card__action"></span>
    </a>
  </template>

  <script src="app.js"></script>
</body>
</html>
