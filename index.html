<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小爱音响控制台 · 下载</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #0d0d12; color: #e8e8ef;
    font: 14px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }
  .box {
    width: 100%; max-width: 380px;
    padding: 30px 26px 22px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    background: rgba(255,255,255,.035);
    box-shadow: 0 30px 60px -30px #000;
  }
  .ico {
    width: 46px; height: 46px; margin: 0 auto 16px;
    border-radius: 12px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    display: grid; place-items: center;
    color: rgba(255,255,255,.75);
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 18px; letter-spacing: .01em; }
  .btn {
    display: block; width: 100%;
    padding: 11px 0;
    border-radius: 9px;
    background: #e8e8ef; color: #0d0d12;
    text-decoration: none;
    font-size: 14px; font-weight: 500;
    transition: background .15s;
  }
  .btn:hover { background: #fff; }
  .tip { margin: 14px 0 0; font-size: 11.5px; color: rgba(255,255,255,.26); }

  .views {
    margin: 18px 0 0;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.07);
    font-size: 12px;
    color: rgba(255,255,255,.34);
    letter-spacing: .02em;
  }
  .views b {
    font-weight: 600;
    color: rgba(255,255,255,.72);
    font-variant-numeric: tabular-nums;
    margin-left: 5px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="ico">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
        <path d="M14 3v5h5"/>
      </svg>
    </div>
    <h1>小爱音响控制台</h1>
    <a class="btn"
       href="https://pub-d389fdf4f7f647648018e562a94b7aba.r2.dev/%E5%B0%8F%E7%88%B1%E9%9F%B3%E5%93%8D%E6%8E%A7%E5%88%B6%E5%8F%B0/%E5%B0%8F%E7%88%B1%E9%9F%B3%E5%93%8D%E6%8E%A7%E5%88%B6%E5%8F%B0.pdf

">下载 / 打开</a>
    <p class="tip">没有自动跳转就点上面的按钮</p>
    <p class="views" id="viewsRow" hidden>访问量<b id="views">—</b></p>
  </div>

<script>
(function () {
  var PDF = 'https://pub-d389fdf4f7f647648018e562a94b7aba.r2.dev/%E5%B0%8F%E7%88%B1%E9%9F%B3%E5%93%8D%E6%8E%A7%E5%88%B6%E5%8F%B0/%E5%B0%8F%E7%88%B1%E9%9F%B3%E5%93%8D%E6%8E%A7%E5%88%B6%E5%8F%B0.pdf

';

  var SB  = 'https://mzxjyupadsakhsceidvm.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16eGp5dXBhZHNha2hzY2VpZHZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNDUzNjYsImV4cCI6MjA4NzkyMTM2Nn0.M4sPqp3-oYuw7JlRYmcqnCkLbRPvDYi7O6yMMdPXu88';
  var HDR = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
  var SEEN = 'pv_1188188';

  var row = document.getElementById('viewsRow');
  var el  = document.getElementById('views');

  var jumped = false;
  function go() {
    if (jumped) return;
    jumped = true;
    location.replace(PDF);
  }

  /* 兜底：不管统计成功还是失败，最多停留 1.6 秒 */
  var hard = setTimeout(go, 1600);

  async function run() {
    var n = null;
    try {
      /* 同一次会话只计一次，刷新不刷量 */
      if (!sessionStorage.getItem(SEEN)) {
        var r = await fetch(SB + '/rest/v1/rpc/bump_view', { method: 'POST', headers: HDR, body: '{}' });
        if (r.ok) {
          var v = await r.json();
          n = typeof v === 'string' ? parseInt(v, 10) : v;
          sessionStorage.setItem(SEEN, '1');
        }
      }
      /* 已经计过，或自增没成功，都退回读总数 */
      if (n === null) {
        var q = await fetch(SB + '/rest/v1/site_views?select=hits&id=eq.1', { headers: HDR });
        if (q.ok) {
          var rows = await q.json();
          if (rows && rows[0]) {
            n = typeof rows[0].hits === 'string' ? parseInt(rows[0].hits, 10) : rows[0].hits;
          }
        }
      }
    } catch (e) {
      /* 统计拿不到就不显示这一行，不影响跳转 */
    }

    if (typeof n === 'number' && isFinite(n) && row && el) {
      el.textContent = n.toLocaleString('en-US');
      row.hidden = false;
      /* 让数字停留 0.7 秒再跳，否则一闪而过看不到 */
      clearTimeout(hard);
      setTimeout(go, 700);
    } else {
      clearTimeout(hard);
      setTimeout(go, 300);
    }
  }

  run();
})();
</script>
</body>
</html>
