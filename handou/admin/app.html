<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理 · 啊游的杂货铺</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="../index.html">
      <span class="brand__mark">铺</span>
      <span>啊游的杂货铺</span>
      <span class="brand__sub">后台</span>
    </a>
    <span class="topbar__meta" data-clock>--:--:--</span>
  </div>
</header>

<!-- ===================== 后台面板 ===================== -->
<div id="appView" class="wrap sheet">
  <div class="adm-head">
    <h1>后台管理</h1>
    <div class="conn conn--inline" id="connApp">
      <span class="conn__dot"></span><span class="conn__tx">检查中…</span>
    </div>
    <span class="who" id="whoami"></span>
    <div class="acts">
      <a class="btn btn--ghost btn--sm" href="../nav/index.html" target="_blank" rel="noopener">看前台</a>
      <button class="btn btn--ghost btn--sm" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="tabs">
    <button data-tab="links" data-on="true">链接管理</button>
    <button data-tab="groups" data-on="false">分组</button>
    <button data-tab="stats" data-on="false">点击统计</button>
  </div>

  <!-- 链接管理 -->
  <div class="pane" id="paneLinks">
    <div class="toolbar">
      <button class="btn btn--solid btn--sm" id="addBtn">新增链接</button>
      <span class="n" id="linkTotal">—</span>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead>
          <tr><th style="width:52px">ID</th><th>标题</th><th>地址</th><th style="width:110px">分类</th><th style="width:96px">排序</th><th style="width:170px"></th></tr>
        </thead>
        <tbody id="linkRows">
          <tr><td colspan="6" class="empty">正在读取…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 分组（常用入口的分类） -->
  <div class="pane" id="paneGroups" hidden>
    <div class="toolbar">
      <button class="btn btn--solid btn--sm" data-add="groups">新增分组</button>
      <span class="hint">改分组名时，这一组的链接会自动跟着改；删分组时链接会挪到第一组。</span>
      <span class="n" id="grpTotal">—</span>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead>
          <tr><th style="width:52px">ID</th><th>分组名</th><th>副标题</th>
              <th style="width:110px">颜色</th><th style="width:70px">排序</th><th style="width:96px"></th></tr>
        </thead>
        <tbody id="rows-groups"><tr><td colspan="6" class="empty">正在读取…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 点击统计 -->
  <div class="pane" id="paneStats" hidden>
    <div id="statsBox"></div>
  </div>
</div>

<!-- ===================== 编辑弹层 ===================== -->
<div class="modal" id="editModal" data-open="false" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="modal__box" style="max-width:440px">
    <div class="modal__t" id="editTitle">改链接</div>
    <div class="modal__d">分类决定它出现在哪一组。地址以 .mp4 / .webm 结尾时，会自动变成视频卡，点了原地播放、不跳站。</div>

    <div style="margin-top:18px">
      <label class="field">
        <span>标题</span>
        <input class="inp" id="fTitle" type="text" placeholder="比如：飞牛安装文件下载">
      </label>
      <label class="field">
        <span>次级标题（可空，显示在标题下面一行小字）</span>
        <input class="inp" id="fSub" type="text" placeholder="比如：官网安装包 / 2026 最新版">
      </label>
      <label class="field">
        <span>地址</span>
        <input class="inp" id="fUrl" type="url" placeholder="https://... 或 https://.../video.mp4">
      </label>
      <label class="field">
        <span>分类</span>
        <select class="inp" id="fCat"></select>
      </label>
      <label class="field">
        <span>排序（同组内，小的在前）</span>
        <input class="inp" id="fSort" type="number" placeholder="留空自动排到最后">
      </label>
      <label class="field">
        <span>口令（可空）</span>
        <input class="inp" id="fPass" type="text" autocomplete="off" placeholder="可留空，表示不需要口令">
      </label>
      <div style="min-height:20px;margin-top:8px;font-size:12.5px;color:var(--lock)" id="editErr"></div>
    </div>

    <div class="modal__acts">
      <button class="btn btn--ghost" data-close>取消</button>
      <button class="btn btn--ghost" id="clearPassBtn" title="把这条的口令删掉">清口令</button>
      <button class="btn btn--solid" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="cModal" data-open="false" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="modal__box" style="max-width:480px">
    <div class="modal__t" id="cTitle">改内容</div>
    <div class="modal__d" id="cDesc">改完保存，前台刷新就能看到。</div>
    <form id="cForm" style="margin-top:16px"><div id="cFields"></div>
      <div style="min-height:20px;margin-top:6px;font-size:12.5px;color:var(--lock)" id="cErr"></div>
      <div class="modal__acts">
        <button class="btn btn--ghost" type="button" data-close>取消</button>
        <button class="btn btn--solid" id="cSave" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
