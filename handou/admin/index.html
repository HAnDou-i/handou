<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 啊游的杂货铺</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="../index.html">
      <span class="brand__mark">铺</span>
      <span>啊游的杂货铺</span>
      <span class="brand__sub">后台</span>
    </a>
    <span class="topbar__meta" data-clock>--:--:--</span>
  </div>
</header>

<!-- ===================== 登录 ===================== -->
<div id="loginView" class="auth">
  <div class="auth__box">
    <span class="k">Admin</span>
    <h1>后台管理</h1>
    <p>只有登录后才能改链接、看点击统计。不用登记，直接用账号进。</p>
    <div class="conn" id="connLogin">
      <span class="conn__dot"></span><span class="conn__tx">检查数据库连接…</span>
    </div>

    <form class="auth__form" id="loginForm" autocomplete="on">
      <label class="field">
        <span>邮箱</span>
        <input class="inp" id="emailInput" type="email" autocomplete="username"
               placeholder="you@example.com" required>
      </label>
      <label class="field">
        <span>密码</span>
        <input class="inp" id="passInput" type="password" autocomplete="current-password"
               placeholder="••••••••" required>
      </label>
      <div class="auth__err" id="loginErr"></div>
      <button class="btn btn--solid btn--block" id="loginBtn" type="submit" style="margin-top:6px">登录</button>
    </form>

    <a class="auth__back" href="../index.html">返回首页</a>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/admin-login.js"></script>
</body>
</html>
