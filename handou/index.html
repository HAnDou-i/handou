<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>啊游的杂货铺</title>
<meta name="description" content="NAS 折腾笔记、常用入口、技术服务。只做技术部署与运维。">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  /* ---- 首页专有 ---- */
  .home-hd {
    display: flex;
    justify-content: center;
    padding-block: clamp(22px, 3.6vw, 34px) clamp(18px, 3vw, 26px);
  }
  .welcome {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 9px 8px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .72);
    border: 1px solid rgba(255, 255, 255, .82);
    box-shadow: 0 12px 28px -24px rgba(60, 44, 92, .8);
    font-size: 13.5px;
    color: var(--ink-2);
    letter-spacing: .01em;
  }
  .welcome svg { width: 15px; height: 15px; color: #E0A02C; flex: 0 0 auto; }
  .welcome b {
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
    color: #fff; background: var(--ink);
    padding: 5px 11px; border-radius: 999px;
  }

  /* 首页没有搜索条，第一组贴着欢迎条 */
  .home #navList { margin-top: 2px; }
  .home .grp:first-child .grp__head { padding-top: 4px; }

  /* 技术服务这一组，标题样式跟上面两组一致 */
  .hgroup { margin-top: 26px; }
  .hgroup__head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 2px 14px;
  }
  .hgroup__head .grp__count a {
    color: var(--ink-3);
    border-bottom: 1px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .hgroup__head .grp__count a:hover {
    color: var(--accent-deep);
    border-color: var(--accent-line);
  }

  /* 底部一条通往「乱七八糟」 */
  .misc-link {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 26px;
    padding: 18px 2px 6px;
    border-top: 1px solid var(--line);
    color: var(--ink-2);
    transition: color .15s;
  }
  .misc-link:hover { color: var(--accent-deep); }
  .misc-link .mt { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
  .misc-link .md { font-size: 12.5px; color: var(--ink-4); }
  .misc-link svg { margin-left: auto; flex: 0 0 auto; transition: transform .16s; }
  .misc-link:hover svg { transform: translateX(3px); }

  /* 左下角后台入口 */
  .corner-admin {
    position: fixed; left: 16px; bottom: 12px; z-index: 40;
    font-size: 12px; letter-spacing: .02em;
    color: var(--ink-3); opacity: .38;
    text-decoration: none;
    padding: 4px 6px; border-radius: 6px;
    transition: opacity .18s, color .18s, background .18s;
  }
  .corner-admin:hover {
    opacity: .95; color: var(--accent-deep);
    background: rgba(255,255,255,.55);
  }

  @media (max-width: 560px) {
    .welcome { font-size: 12.5px; padding: 7px 8px 7px 14px; gap: 8px; }
    .misc-link .md { display: none; }
    .corner-admin { left: 12px; bottom: 10px; }
  }
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" href="index.html">
      <span class="brand__mark">铺</span>
      <span>啊游的杂货铺</span>
      <span class="brand__sub">handou</span>
    </a>
    <span class="topbar__meta" data-clock>--:--:--</span>
  </div>
</header>

<main>
  <section class="wrap home">

    <!-- 欢迎条 -->
    <div class="home-hd">
      <div class="welcome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.5 2.5 5 13.2h5.4L9.8 21.5 18.6 10.6h-5.5l.4-8.1Z"/>
        </svg>
        <span>欢迎访问 · 啊游的杂货铺</span>
        <b>HanDou</b>
      </div>
    </div>

    <!-- 常用 / 其他：脚本按 Supabase 数据渲染 -->
    <div id="navList"></div>

    <!-- 技术服务 -->
    <section class="hgroup">
      <div class="hgroup__head">
        <span class="grp__dot" style="background:#9A7FD1"></span>
        <span class="grp__name">技术服务支持</span>
        <span class="grp__count">
          <a href="services/index.html"><span data-svc-count>3</span> 项服务</a>
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"
               style="vertical-align:-2px">
            <path d="M6.4 3.4 11 8l-4.6 4.6" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>

      <div class="svcards" id="svcList">
        <a class="svcard" href="services/movie.html">
          <span class="svcard__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.2"/><path d="M7.4 4.5v15M16.6 4.5v15M3 9.6h4.4M3 14.4h4.4M16.6 9.6H21M16.6 14.4H21"/></svg></span>
          <span class="svcard__h">
            <span class="svcard__t">私人影音库搭建</span>
            <span class="svbadge">热门</span>
          </span>
        </a>
        <a class="svcard" href="services/music.html">
          <span class="svcard__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17.5V6.2l10-2v11.3"/><ellipse cx="6.5" cy="17.8" rx="2.6" ry="2.3"/><ellipse cx="16.5" cy="15.6" rx="2.6" ry="2.3"/></svg></span>
          <span class="svcard__h">
            <span class="svcard__t">音乐库整理服务</span>
            <span class="svbadge">音质党</span>
          </span>
        </a>
        <a class="svcard" href="services/nas.html">
          <span class="svcard__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="4" width="17.6" height="6.4" rx="1.8"/><rect x="3.2" y="13.6" width="17.6" height="6.4" rx="1.8"/><path d="M6.8 7.2h.02M6.8 16.8h.02M11 7.2h4.6M11 16.8h4.6"/></svg></span>
          <span class="svcard__h">
            <span class="svcard__t">NAS 远程运维</span>
            <span class="svbadge">省心</span>
          </span>
        </a>
      </div>
    </section>

    <!-- 通往分享页 -->
    <a class="misc-link" href="share/index.html">
      <span class="mt">乱七八糟</span>
      <span class="md">自己使用总结 · 免费分享的内容</span>
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 8h10M8.6 3.6 13 8l-4.4 4.4" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

  </section>
</main>

<!-- 左下角的后台入口：和原来一样，低调贴着屏幕边 -->
<a class="corner-admin" href="admin/index.html" title="后台管理">管理</a>

<footer class="foot">
  <div class="wrap foot__in">
    <div>
      啊游的杂货铺 · <span data-year></span><br>
      只提供技术部署与运维服务，不提供、不存储、不传播任何影视或音乐内容。
    </div>
    <div class="r">
      1188188.xyz
    </div>
  </div>
</footer>

<!-- ===== 口令浮层 ===== -->
<div class="modal" id="passModal" data-open="false" role="dialog" aria-modal="true" aria-labelledby="passTitle">
  <div class="modal__box">
    <div class="modal__t" id="passTitle">受口令保护</div>
    <div class="modal__d" id="passDesc">这个入口需要口令才能打开。</div>
    <div style="margin-top:16px">
      <label class="field">
        <span>口令</span>
        <input class="inp" id="passInput" type="password" autocomplete="off" placeholder="输入后回车">
      </label>
      <div style="min-height:20px;margin-top:8px;font-size:12.5px;color:var(--lock)" id="passErr"></div>
    </div>
    <div class="modal__acts">
      <button class="btn btn--ghost" data-close>取消</button>
      <button class="btn btn--solid" id="passOk">打开</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/content.js"></script>
<script>
  /* 技术服务卡：库里配了就按库里的来，没配就用上面写死的这版 */
  CONTENT.mountServices(document.getElementById('svcList'), { base: 'services/' });
</script>
</body>
</html>
