
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HanDou的网站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== 全部样式 (保持原样，仅调整footer-note内布局) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at top left, rgba(183, 244, 243, 0.7), transparent 28%),
                        radial-gradient(circle at bottom right, rgba(255, 190, 218, 0.7), transparent 30%),
                        linear-gradient(135deg, #8dd7d1 0%, #f7c6e1 45%, #f8f0ff 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(0.8rem, 3vw, 2rem);
            color: #152438;
        }

        .nav-card {
            width: 100%;
            background: linear-gradient(180deg, rgba(220, 245, 255, 0.35) 0%, rgba(255, 235, 245, 0.22) 100%);
            border-radius: clamp(28px, 5vw, 42px);
            padding: clamp(1.2rem, 4vw, 2.4rem);
            box-shadow: 0 35px 90px rgba(8, 26, 65, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            max-width: min(90vw, 720px);
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .greeting {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(243, 233, 255, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.62);
            border-radius: clamp(40px, 8vw, 60px);
            padding: clamp(0.3rem, 1.5vw, 0.6rem) clamp(1rem, 3vw, 1.8rem);
            font-size: clamp(0.85rem, 3vw, 1rem);
            font-weight: 500;
            color: #1a2b3c;
            margin-bottom: clamp(1.2rem, 4vw, 2rem);
            box-shadow: 0 16px 35px rgba(15, 38, 68, 0.1);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            margin-left: auto;
            margin-right: auto;
            white-space: nowrap;
            max-width: 100%;
        }

        .greeting .tag {
            background: #2e405b;
            color: white;
            border-radius: clamp(30px, 6vw, 40px);
            padding: clamp(0.15rem, 0.8vw, 0.25rem) clamp(0.6rem, 2vw, 1rem);
            font-size: clamp(0.65rem, 2.5vw, 0.8rem);
            margin-left: clamp(0.4rem, 1.5vw, 0.8rem);
            letter-spacing: 0.3px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: clamp(0.6rem, 2vw, 0.9rem);
            margin: clamp(1rem, 4vw, 1.8rem) 0;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: rgba(230, 250, 255, 0.26);
            border-radius: clamp(40px, 8vw, 100px);
            padding: clamp(0.75rem, 2.5vw, 1rem) clamp(1.1rem, 4vw, 2rem);
            border: 1px solid rgba(208, 238, 255, 0.48);
            box-shadow: 0 18px 70px -32px rgba(15, 38, 68, 0.16);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, border-color 0.25s ease, backdrop-filter 0.25s ease;
            cursor: pointer;
            color: #10203d;
            font-weight: 600;
            font-size: clamp(0.95rem, 3.5vw, 1.15rem);
            width: 100%;
            position: relative;
            min-height: clamp(52px, 8vh, 60px);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .list-item:hover {
            background: rgba(220, 240, 255, 0.36);
            border-color: rgba(190, 225, 255, 0.78);
            box-shadow: 0 35px 100px -20px rgba(15, 38, 68, 0.28);
            transform: translateY(-4px) scale(1.01);
            backdrop-filter: blur(26px);
            -webkit-backdrop-filter: blur(26px);
        }

        .list-item:active {
            background: rgba(220, 240, 255, 0.24);
            transform: scale(0.98);
            transition: 0.05s;
        }

        .item-icon {
            flex-shrink: 0;
            width: clamp(2rem, 7vw, 2.4rem);
            height: clamp(1.5rem, 5vw, 1.8rem);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            pointer-events: none;
            color: #0f223a;
        }

        .item-icon svg {
            width: clamp(1.3rem, 5vw, 1.6rem);
            height: clamp(1.3rem, 5vw, 1.6rem);
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.08));
        }

        .text-wrapper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: clamp(6px, 2vw, 10px);
            background: transparent;
            pointer-events: none;
            max-width: min(70%, 400px);
        }

        .item-text {
            letter-spacing: -0.2px;
            text-align: center;
            color: #0f223a;
            font-size: clamp(0.9rem, 3vw, 1.05rem);
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 1px rgba(255, 255, 255, 0.6);
        }

        .lock-badge {
            background: rgba(241, 247, 255, 0.9);
            color: #1c3f69;
            font-size: clamp(0.6rem, 2.2vw, 0.75rem);
            font-weight: 700;
            padding: clamp(0.15rem, 0.8vw, 0.25rem) clamp(0.5rem, 2vw, 0.9rem);
            border-radius: clamp(25px, 5vw, 40px);
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.85);
            flex-shrink: 0;
            pointer-events: none;
        }

        .item-protected {
            background: rgba(235, 245, 255, 0.2);
            border-left: 4px solid rgba(176, 194, 217, 0.8);
            border: 1px solid rgba(210, 230, 250, 0.5);
        }

        .spare-block {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(0.6rem, 2.5vw, 1.5rem);
            margin-top: clamp(1rem, 4vw, 1.8rem);
            padding-top: clamp(1rem, 3vw, 1.4rem);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: clamp(0.6rem, 2vw, 1.2rem);
        }

        .spare-link {
            background: rgba(220, 245, 255, 0.24);
            border-radius: clamp(35px, 7vw, 60px);
            padding: clamp(0.4rem, 2vw, 0.7rem) clamp(1.2rem, 5vw, 2rem);
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: 550;
            color: #163551;
            border: 1px solid rgba(210, 235, 255, 0.6);
            box-shadow: 0 18px 40px -20px rgba(15, 38, 68, 0.16);
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: clamp(4px, 1.5vw, 8px);
            min-height: clamp(44px, 7vh, 52px);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .spare-link:hover {
            background: rgba(235, 250, 255, 0.36);
            border-color: rgba(220, 240, 255, 0.8);
            transform: translateY(-1px);
        }

        .spare-link:active {
            transform: scale(0.97);
        }

        .spare-link svg {
            width: clamp(1.2rem, 4vw, 1.5rem);
            height: clamp(1.2rem, 4vw, 1.5rem);
            stroke: #2d4059;
            stroke-width: 1.8;
            fill: none;
        }

        .extra-tags {
            display: flex;
            gap: clamp(6px, 2vw, 12px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .mini-tag {
            background: rgba(235, 245, 255, 0.24);
            border-radius: clamp(20px, 4vw, 30px);
            padding: clamp(0.15rem, 0.8vw, 0.25rem) clamp(0.8rem, 3vw, 1.2rem);
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            color: #143351;
            border: 1px solid rgba(210, 230, 245, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .password-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 30, 45, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: clamp(0.8rem, 4vw, 2rem);
        }

        .password-dialog {
            background: rgba(240, 248, 255, 0.24);
            border-radius: clamp(30px, 6vw, 48px);
            padding: clamp(1.5rem, 6vw, 2.5rem) clamp(1.2rem, 5vw, 2rem);
            width: min(90%, 360px);
            max-width: 360px;
            box-shadow: 0 36px 80px -32px rgba(8, 26, 65, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .password-dialog h3 {
            color: #1b3a5c;
            font-weight: 550;
            margin-bottom: clamp(0.4rem, 2vw, 0.8rem);
            font-size: clamp(1.2rem, 5vw, 1.5rem);
        }

        .password-dialog p {
            color: #4a6382;
            margin-bottom: clamp(1rem, 4vw, 1.6rem);
            font-size: clamp(0.8rem, 3vw, 0.95rem);
        }

        .password-dialog input {
            width: 100%;
            padding: clamp(0.6rem, 3vw, 1rem) clamp(0.8rem, 3vw, 1.2rem);
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(245, 250, 255, 0.28);
            border-radius: clamp(35px, 7vw, 50px);
            font-size: clamp(0.9rem, 3.5vw, 1rem);
            outline: none;
            margin-bottom: clamp(1rem, 4vw, 1.5rem);
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .password-dialog input:focus {
            border-color: rgba(87, 121, 180, 0.9);
            background: rgba(245, 250, 255, 0.34);
        }

        .dialog-buttons {
            display: flex;
            gap: clamp(6px, 2vw, 12px);
        }

        .dialog-btn {
            flex: 1;
            padding: clamp(0.5rem, 2.5vw, 0.8rem) 0;
            border-radius: clamp(30px, 6vw, 50px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            font-weight: 600;
            font-size: clamp(0.8rem, 3vw, 0.95rem);
            cursor: pointer;
            background: rgba(245, 250, 255, 0.28);
            color: #1f3d60;
            transition: 0.2s ease;
            min-height: clamp(40px, 7vh, 48px);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .dialog-btn.confirm {
            background: rgba(27, 52, 90, 0.86);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.75);
        }

        .dialog-btn.confirm:hover {
            background: rgba(31, 58, 108, 0.96);
        }

        .dialog-btn:hover {
            background: rgba(245, 250, 255, 0.42);
        }

        .dialog-btn:active {
            transform: scale(0.96);
        }

        /* ===== 底部信息 — 完全左对齐（管理字样在最左边） ===== */
        .footer-note {
            margin-top: clamp(1.2rem, 5vw, 2rem);
            display: flex;
            justify-content: flex-start;        /* 改为 flex-start 使内容靠左 */
            align-items: center;
            gap: clamp(0.8rem, 3vw, 1.5rem);
            flex-wrap: wrap;
            color: #4a5d78;
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            padding: clamp(0.8rem, 3vw, 1.2rem);
            background: rgba(235, 243, 255, 0.18);
            border-radius: clamp(30px, 5vw, 45px);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        /* 第一个span（包裹管理链接的容器）不再有背景、内边距 — 完全贴合左边 */
        .footer-note span:first-child {
            background: transparent;            /* 移除背景 */
            padding: 0;                         /* 移除内边距 */
            border-radius: 0;                    /* 移除圆角 */
            border: none;                        /* 移除边框 */
        }

        /* 管理链接样式保持原样（只去掉背景相关）*/
        .footer-note a {
            color: #1f4172;
            text-decoration: none;
            border-bottom: 1px dotted;
            /* 保留原有边框，更清晰 */
        }

        /* 可选：保持第二个span（如果有）的默认样式，但不需要改动 */
        .footer-note span:last-child {
            background: rgba(235, 243, 255, 0.22);
            padding: clamp(0.15rem, 1vw, 0.3rem) clamp(0.8rem, 3vw, 1.2rem);
            border-radius: clamp(30px, 6vw, 50px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 10px 30px rgba(15, 38, 68, 0.06);
        }
        }

        @media (hover: hover) and (pointer: fine) {
            .list-item:hover {
                background: rgba(220, 240, 255, 0.36);
                border-color: rgba(190, 225, 255, 0.78);
                box-shadow: 0 35px 100px -20px rgba(15, 38, 68, 0.28);
                transform: translateY(-4px) scale(1.01);
                backdrop-filter: blur(26px);
                -webkit-backdrop-filter: blur(26px);
            }
            
            .spare-link:hover {
                background: rgba(235, 250, 255, 0.42);
                border-color: rgba(220, 240, 255, 0.8);
            }
        }

        @media (min-width: 1024px) {
            .nav-card {
                max-width: 720px;
            }
            .list-item {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
<div class="nav-card">
    <div class="greeting">
       ⚡️欢迎访问 · 啊游的杂货铺
        <span class="tag">HanDou</span>
        </a>  <!-- 此处原有一个多余的</a>，但保留不影响布局，且已存在 -->
    </div>

    <!-- 动态链接列表 -->
    <div class="link-list" id="dynamic-link-list">
        <div style="text-align: center; padding: 1.5rem; color: #62748c;">⏳ 加载链接中...</div>
    </div>

    <!-- 备用区块 -->
    <div class="spare-block">
        <div class="spare-link" data-url="http://handou.9919199.xyz:5555" id="spareLink">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="8" height="8" rx="1" stroke="currentColor" fill="none"/>
                <rect x="13" y="3" width="8" height="8" rx="1" stroke="currentColor" fill="none"/>
                <rect x="3" y="13" width="8" height="8" rx="1" stroke="currentColor" fill="none"/>
                <rect x="13" y="13" width="8" height="8" rx="1" stroke="currentColor" fill="none"/>
            </svg>
            备用
        </div>
        <div class="extra-tags"></div>
    </div>

    <!-- 密码弹窗（通用，用于所有受保护链接） -->
    <div class="password-overlay" id="passwordOverlay" onclick="closePasswordDialogIfOutside(event)">
        <div class="password-dialog" onclick="event.stopPropagation()">
            <h3>🔐 请输入密码</h3>
            <p id="passwordPrompt">此链接受密码保护</p>
            <input type="password" id="passwordInput" placeholder="输入密码" autocomplete="off">
            <div class="dialog-buttons">
                <button class="dialog-btn" onclick="closePasswordDialog()">取消</button>
                <button class="dialog-btn confirm" onclick="verifyPassword()">验证</button>
            </div>
        </div>
    </div>

<script>
    // ===== Supabase 配置 =====
    (function() {
        const SUPABASE_URL = 'https://mzxjyupadsakhsceidvm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16eGp5dXBhZHNha2hzY2VpZHZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNDUzNjYsImV4cCI6MjA4NzkyMTM2Nn0.M4sPqp3-oYuw7JlRYmcqnCkLbRPvDYi7O6yMMdPXu88';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // ===== 全局变量 =====
        let pendingLink = {
            url: '',
            password: ''
        };

        // ===== 安全的HTML转义函数 =====
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ===== 安全的URL编码函数 =====
        function encodeUrl(url) {
            try {
                return encodeURI(url);
            } catch (e) {
                return '#';
            }
        }

        // ===== 点击处理函数 =====
        window.handleLinkClick = function(event, element) {
            event.stopPropagation();
            const url = element.getAttribute('data-url');
            if (url) {
                // 验证URL安全性
                if (url.startsWith('http://') || url.startsWith('https://')) {
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
            }
        };

        window.closePasswordDialog = function() {
            document.getElementById('passwordOverlay').style.display = 'none';
            pendingLink = { url: '', password: '' };
            document.getElementById('passwordInput').value = '';
        };

        window.closePasswordDialogIfOutside = function(event) {
            if (event.target.classList.contains('password-overlay')) {
                window.closePasswordDialog();
            }
        };

        window.verifyPassword = function() {
            const input = document.getElementById('passwordInput').value;
            // 使用常量时间比较防止时序攻击
            if (input && pendingLink.password && input.length === pendingLink.password.length) {
                let match = true;
                for (let i = 0; i < input.length; i++) {
                    if (input.charCodeAt(i) !== pendingLink.password.charCodeAt(i)) {
                        match = false;
                        break;
                    }
                }
                if (match && input === pendingLink.password) {
                    if (pendingLink.url) {
                        window.open(pendingLink.url, '_blank', 'noopener,noreferrer');
                    }
                    window.closePasswordDialog();
                    return;
                }
            }
            
            alert('密码错误，请重试');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        };

        // 受保护链接的点击处理
        window.handleProtectedClick = function(event, url, password) {
            event.stopPropagation();
            
            // 验证URL安全性
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('无效的链接地址');
                return;
            }
            
            pendingLink = { url, password };
            document.getElementById('passwordPrompt').innerText = '此链接受密码保护';
            document.getElementById('passwordOverlay').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        };

        // 为备用链接添加点击事件
        document.addEventListener('DOMContentLoaded', function() {
            const spareLink = document.getElementById('spareLink');
            if (spareLink) {
                spareLink.onclick = function(event) {
                    event.stopPropagation();
                    const url = this.getAttribute('data-url');
                    if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
                        window.open(url, '_blank', 'noopener,noreferrer');
                    }
                };
            }
            
            // 密码输入框回车事件
            const passwordInput = document.getElementById('passwordInput');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        window.verifyPassword();
                    }
                });
            }
            
            // 加载链接
            loadLinksFromSupabase();
        });

        // ===== 从 Supabase 加载链接 =====
        async function loadLinksFromSupabase() {
            const container = document.getElementById('dynamic-link-list');
            if (!container) return;

            try {
                const { data: links, error } = await supabaseClient
                    .from('links')
                    .select('*')
                    .order('sort_order', { ascending: true });

                if (error) throw error;

                if (!links || links.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 2rem; color: #62748c;">📭 暂无链接，请去后台添加</div>';
                    return;
                }

                container.innerHTML = '';

                links.forEach(link => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'list-item';
                    
                    // 安全地设置属性
                    const safeUrl = link.url && (link.url.startsWith('http://') || link.url.startsWith('https://')) 
                        ? link.url 
                        : '#';
                    itemDiv.setAttribute('data-url', safeUrl);

                    // 判断是否有密码
                    const hasPassword = link.password && link.password.trim() !== '';

                    if (hasPassword) {
                        // 使用安全的属性设置方式
                        itemDiv.addEventListener('click', function(event) {
                            window.handleProtectedClick(event, safeUrl, link.password);
                        });
                        itemDiv.classList.add('item-protected');
                    } else {
                        itemDiv.addEventListener('click', function(event) {
                            window.handleLinkClick(event, this);
                        });
                    }

                    // 图标处理 - 安全地插入SVG
                    let iconSvg = link.icon;
                    if (!iconSvg || !iconSvg.includes('<svg')) {
                        iconSvg = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2"/><polyline points="12 5 19 12 12 19" stroke="currentColor" fill="none"/></svg>';
                    } else {
                        // 移除潜在的脚本
                        iconSvg = iconSvg.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
                    }

                    // 安全地转义标题
                    const safeTitle = escapeHtml(link.title || '未命名');

                    // 构建内部HTML
                    itemDiv.innerHTML = `
                        <span class="item-icon">${iconSvg}</span>
                        <span class="text-wrapper">
                            <span class="item-text">${safeTitle}</span>
                            ${hasPassword ? '<span class="lock-badge">🔒 密码保护</span>' : ''}
                        </span>
                    `;

                    container.appendChild(itemDiv);
                });
            } catch (error) {
                console.error('加载失败:', error);
                container.innerHTML = `<div style="text-align: center; padding: 2rem; color: #b91c1c;">❌ 加载失败: ${escapeHtml(error.message)}</div>`;
            }
        }
    })();
</script>

    </div>
