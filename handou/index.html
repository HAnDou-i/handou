<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HanDou的个人导航站 - 啊游的杂货铺">
    <meta name="theme-color" content="#8dd7d1">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <title>HanDou的网站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at top left, rgba(183, 244, 243, 0.7), transparent 28%),
                        radial-gradient(circle at bottom right, rgba(255, 190, 218, 0.7), transparent 30%),
                        linear-gradient(135deg, #8dd7d1 0%, #f7c6e1 45%, #f8f0ff 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(1.5rem, 5vw, 3rem) clamp(0.8rem, 3vw, 2rem);
            color: #152438;
        }

        /* ===== 深色模式 ===== */
        @media (prefers-color-scheme: dark) {
            body {
                background: radial-gradient(circle at top left, rgba(30, 80, 90, 0.5), transparent 28%),
                            radial-gradient(circle at bottom right, rgba(90, 40, 70, 0.4), transparent 30%),
                            linear-gradient(135deg, #1a2a3a 0%, #2a1a3a 45%, #1e1530 100%);
                color: #d8e4f0;
            }
            .main-card { background: rgba(20, 30, 50, 0.45); border-color: rgba(255,255,255,0.12); }
            .greeting { background: rgba(40, 55, 80, 0.35); border-color: rgba(255,255,255,0.15); color: #d0dce8; }
            .greeting .tag { background: rgba(180, 200, 230, 0.25); color: #c8d8ec; }
            .section-header { color: #d0dce8; }
            .section-header .arrow { color: #8898a8; }
            .section-body { border-color: rgba(255,255,255,0.08); }
            .link-item { background: rgba(30, 45, 70, 0.3); border-color: rgba(255,255,255,0.1); color: #c8d8ec; }
            .link-item:hover { background: rgba(40, 60, 90, 0.4); border-color: rgba(255,255,255,0.2); }
            .link-item .item-icon { color: #c8d8ec; }
            .link-item .item-text { color: #c8d8ec; }
            .lock-badge { background: rgba(40, 55, 80, 0.6); color: #a8c0d8; border-color: rgba(255,255,255,0.15); }
            .spare-link { background: rgba(30, 45, 70, 0.3); border-color: rgba(255,255,255,0.1); color: #c8d8ec; }
            .spare-link:hover { background: rgba(40, 60, 90, 0.4); }
            .footer-note a { color: #7ca8d0; }
            .password-overlay { background: rgba(0, 0, 0, 0.65); }
            .password-dialog { background: rgba(20, 30, 50, 0.6); border-color: rgba(255,255,255,0.15); }
            .password-dialog h3 { color: #d0dce8; }
            .password-dialog p { color: #8898a8; }
            .password-dialog input { background: rgba(30, 45, 70, 0.4); border-color: rgba(255,255,255,0.12); color: #d0dce8; }
            .dialog-btn { background: rgba(30, 45, 70, 0.4); color: #c8d8ec; border-color: rgba(255,255,255,0.12); }
            .dialog-btn.confirm { background: rgba(60, 90, 140, 0.7); }
            .dialog-btn:hover { background: rgba(40, 60, 90, 0.5); }
        }

        /* ===== 动画 ===== */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* ===== 顶部问候 ===== */
        .greeting {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(243, 233, 255, 0.38);
            border: 1px solid rgba(255, 255, 255, 0.62);
            border-radius: clamp(40px, 8vw, 60px);
            padding: clamp(0.3rem, 1.5vw, 0.6rem) clamp(1rem, 3vw, 1.8rem);
            font-size: clamp(0.85rem, 3vw, 1rem);
            font-weight: 500;
            color: #1a2b3c;
            margin-bottom: clamp(1.5rem, 4vw, 2rem);
            box-shadow: 0 16px 35px rgba(15, 38, 68, 0.1);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            white-space: nowrap;
            animation: fadeSlideIn 0.5s ease both;
        }
        .greeting .tag {
            background: #2e405b;
            color: white;
            border-radius: clamp(30px, 6vw, 40px);
            padding: clamp(0.15rem, 0.8vw, 0.25rem) clamp(0.6rem, 2vw, 1rem);
            font-size: clamp(0.65rem, 2.5vw, 0.8rem);
            margin-left: clamp(0.4rem, 1.5vw, 0.8rem);
            letter-spacing: 0.3px;
        }

        /* ===== 主卡片容器 ===== */
        .main-card {
            width: 100%;
            max-width: min(90vw, 720px);
            background: rgba(255, 255, 255, 0.28);
            border-radius: clamp(24px, 5vw, 36px);
            padding: clamp(1.2rem, 3vw, 2rem);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 20px 50px rgba(15, 38, 68, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeSlideIn 0.5s ease both;
        }

        /* ===== 模块头部（可折叠） ===== */
        .section {
            margin-bottom: clamp(0.8rem, 2vw, 1rem);
        }
        .section:last-child { margin-bottom: 0; }

        .section-header {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 12px);
            padding: clamp(0.7rem, 2vw, 1rem) clamp(0.5rem, 2vw, 0.8rem);
            cursor: pointer;
            border-radius: clamp(16px, 3vw, 24px);
            transition: background 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .section-header:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .section-dot {
            width: clamp(10px, 3vw, 14px);
            height: clamp(10px, 3vw, 14px);
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section-title {
            font-size: clamp(0.95rem, 3.5vw, 1.1rem);
            font-weight: 650;
            color: #1a2b3c;
            flex: 1;
        }

        .section-count {
            font-size: clamp(0.7rem, 2.5vw, 0.8rem);
            color: #7f8fa4;
        }

        .arrow {
            font-size: 0.8rem;
            color: #7f8fa4;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }
        .arrow.open { transform: rotate(90deg); }

        /* ===== 折叠内容 ===== */
        .section-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.3s ease,
                        padding 0.3s ease;
            opacity: 0;
            padding: 0 clamp(0.5rem, 2vw, 0.8rem);
        }
        .section-body.open {
            opacity: 1;
            padding: clamp(0.3rem, 1.5vw, 0.6rem) clamp(0.5rem, 2vw, 0.8rem) clamp(0.5rem, 2vw, 0.8rem);
        }

        /* ===== 链接网格 ===== */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(140px, 30vw, 180px), 1fr));
            gap: clamp(8px, 2vw, 12px);
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: rgba(230, 250, 255, 0.26);
            border-radius: clamp(30px, 6vw, 50px);
            padding: clamp(0.55rem, 2vw, 0.75rem) clamp(0.8rem, 3vw, 1.2rem);
            border: 1px solid rgba(208, 238, 255, 0.48);
            box-shadow: 0 4px 16px rgba(15, 38, 68, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            cursor: pointer;
            color: #10203d;
            font-weight: 550;
            font-size: clamp(0.85rem, 3vw, 0.95rem);
            min-height: clamp(44px, 6vh, 52px);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            gap: clamp(6px, 2vw, 10px);
        }
        .link-item:hover {
            background: rgba(220, 240, 255, 0.38);
            border-color: rgba(190, 225, 255, 0.78);
            box-shadow: 0 8px 24px rgba(15, 38, 68, 0.12);
            transform: translateY(-2px) scale(1.01);
        }
        .link-item:active {
            background: rgba(220, 240, 255, 0.24);
            transform: scale(0.97);
            transition: 0.05s;
        }

        .item-icon {
            flex-shrink: 0;
            width: clamp(1.4rem, 5vw, 1.8rem);
            height: clamp(1.4rem, 5vw, 1.8rem);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            color: #0f223a;
        }
        .item-icon svg {
            width: clamp(1.1rem, 4vw, 1.4rem);
            height: clamp(1.1rem, 4vw, 1.4rem);
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.08));
        }
        .item-text {
            letter-spacing: -0.2px;
            color: #0f223a;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 1px rgba(255, 255, 255, 0.6);
        }
        .lock-badge {
            background: rgba(241, 247, 255, 0.9);
            color: #1c3f69;
            font-size: clamp(0.55rem, 2vw, 0.65rem);
            font-weight: 700;
            padding: clamp(0.1rem, 0.5vw, 0.15rem) clamp(0.4rem, 1.5vw, 0.6rem);
            border-radius: clamp(20px, 4vw, 30px);
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.85);
            flex-shrink: 0;
            pointer-events: none;
        }

        /* ===== 底部备用链接 ===== */
        .spare-block {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(0.6rem, 2.5vw, 1.2rem);
            margin-top: clamp(1.5rem, 4vw, 2rem);
            padding-top: clamp(1rem, 3vw, 1.4rem);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
        }
        .spare-link {
            background: rgba(220, 245, 255, 0.24);
            border-radius: clamp(35px, 7vw, 60px);
            padding: clamp(0.4rem, 2vw, 0.7rem) clamp(1.2rem, 5vw, 2rem);
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: 550;
            color: #163551;
            border: 1px solid rgba(210, 235, 255, 0.6);
            box-shadow: 0 6px 20px rgba(15, 38, 68, 0.06);
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: clamp(4px, 1.5vw, 8px);
            min-height: clamp(44px, 6vh, 52px);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .spare-link:hover { background: rgba(235, 250, 255, 0.36); border-color: rgba(220, 240, 255, 0.8); transform: translateY(-1px); }
        .spare-link:active { transform: scale(0.97); }
        .spare-link svg { width: clamp(1.2rem, 4vw, 1.5rem); height: clamp(1.2rem, 4vw, 1.5rem); stroke: #2d4059; stroke-width: 1.8; fill: none; }

        .footer-note {
            position: fixed;
            bottom: 10px;
            left: 15px;
            padding: 0;
        }
        .footer-note a { color: #1f4172; text-decoration: none; font-size: 0.6rem; opacity: 0.35; transition: opacity 0.2s; }
        .footer-note a:hover { opacity: 0.7; }

        /* ===== 骨架屏 ===== */
        .skeleton-section {
            padding: clamp(0.7rem, 2vw, 1rem) clamp(0.5rem, 2vw, 0.8rem);
        }
        .skeleton-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        }
        .skeleton-dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(90deg, rgba(200,220,240,0.2) 25%, rgba(200,220,240,0.4) 50%, rgba(200,220,240,0.2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        .skeleton-line { border-radius: 8px; background: linear-gradient(90deg, rgba(200,220,240,0.15) 25%, rgba(200,220,240,0.3) 50%, rgba(200,220,240,0.15) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        .skeleton-line.title { width: 35%; height: 16px; }
        .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .skeleton-card { height: 48px; border-radius: 50px; background: linear-gradient(90deg, rgba(200,220,240,0.12) 25%, rgba(200,220,240,0.25) 50%, rgba(200,220,240,0.12) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }

        /* ===== 密码弹窗 ===== */
        .password-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 30, 45, 0.6);
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: clamp(0.8rem, 4vw, 2rem);
            opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .password-overlay.active { opacity: 1; visibility: visible; }
        .password-dialog {
            background: rgba(240, 248, 255, 0.24);
            border-radius: clamp(30px, 6vw, 48px);
            padding: clamp(1.5rem, 6vw, 2.5rem) clamp(1.2rem, 5vw, 2rem);
            width: min(90%, 360px);
            box-shadow: 0 36px 80px -32px rgba(8, 26, 65, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transform: scale(0.95); transition: transform 0.25s ease;
        }
        .password-overlay.active .password-dialog { transform: scale(1); }
        .password-dialog.shake { animation: shake 0.4s ease; }
        .password-dialog h3 { color: #1b3a5c; font-weight: 550; margin-bottom: 0.6rem; font-size: clamp(1.2rem, 5vw, 1.5rem); }
        .password-dialog p { color: #4a6382; margin-bottom: 1.2rem; font-size: clamp(0.8rem, 3vw, 0.95rem); }
        .password-input-wrap { position: relative; margin-bottom: 1rem; }
        .password-input-wrap .lock-icon { position: absolute; left: clamp(0.8rem, 3vw, 1.2rem); top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: #7f8fa4; fill: none; stroke-width: 2; pointer-events: none; }
        .password-dialog input {
            width: 100%; padding: clamp(0.6rem, 3vw, 1rem) clamp(2.2rem, 6vw, 2.8rem);
            border: 1px solid rgba(255,255,255,0.5); background: rgba(245,250,255,0.28);
            border-radius: clamp(35px, 7vw, 50px); font-size: clamp(0.9rem, 3.5vw, 1rem);
            outline: none; text-align: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.2s, background 0.2s;
        }
        .password-dialog input:focus { border-color: rgba(87, 121, 180, 0.9); background: rgba(245, 250, 255, 0.34); }
        .password-error { color: #dc3545; font-size: 0.85rem; margin-bottom: 0.8rem; min-height: 1.2em; }
        .dialog-buttons { display: flex; gap: 8px; }
        .dialog-btn {
            flex: 1; padding: clamp(0.5rem, 2.5vw, 0.8rem) 0;
            border-radius: clamp(30px, 6vw, 50px);
            border: 1px solid rgba(255,255,255,0.55);
            font-weight: 600; font-size: clamp(0.8rem, 3vw, 0.95rem);
            cursor: pointer; background: rgba(245,250,255,0.28);
            color: #1f3d60; transition: 0.2s ease;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .dialog-btn.confirm { background: rgba(27, 52, 90, 0.86); color: white; border: 1px solid rgba(255,255,255,0.75); }
        .dialog-btn.confirm:hover { background: rgba(31, 58, 108, 0.96); }
        .dialog-btn:hover { background: rgba(245,250,255,0.42); }
        .dialog-btn:active { transform: scale(0.96); }

        /* ===== 空模块提示 ===== */
        .empty-module {
            text-align: center;
            padding: clamp(0.8rem, 2vw, 1.2rem);
            color: #7f8fa4;
            font-size: 0.85rem;
        }

        @media (min-width: 1024px) {
            .main-card { max-width: 720px; }
        }

        /* ===== 右侧赞赏悬浮模块 ===== */
        .donate-panel {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 900;
            width: 240px;
            padding: 0.95rem;
            background: rgba(240, 248, 255, 0.44);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-right: none;
            border-radius: 24px 0 0 24px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 12px 30px rgba(15, 38, 68, 0.14);
            animation: fadeSlideIn 0.6s ease both;
            animation-delay: 0.3s;
            transition: transform 0.28s ease, box-shadow 0.28s ease;
            overflow: hidden;
        }
        .donate-panel.collapsed {
            transform: translate(176px, -50%);
            cursor: pointer;
        }
        .donate-panel.collapsed:hover {
            box-shadow: 0 16px 36px rgba(15, 38, 68, 0.18);
        }
        .donate-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.45rem;
            margin-bottom: 0.65rem;
            color: #1a2b3c;
            font-size: 0.92rem;
            font-weight: 650;
            line-height: 1.2;
            cursor: pointer;
        }
        .donate-panel-title {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            min-width: 0;
            white-space: nowrap;
        }
        .donate-panel-header svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
        }
        .donate-toggle-icon {
            font-size: 0.9rem;
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }
        .donate-panel.collapsed .donate-toggle-icon {
            transform: rotate(180deg);
        }
        .donate-content {
            max-height: 320px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.28s ease, opacity 0.2s ease, margin-top 0.2s ease;
        }
        .donate-panel.collapsed .donate-content {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }
        .donate-panel-text {
            color: #4a6382;
            font-size: 0.72rem;
            line-height: 1.45;
            margin-bottom: 0.7rem;
        }
        .donate-qr {
            display: block;
            width: 190px;
            height: 190px;
            margin: 0 auto;
            object-fit: contain;
            border-radius: 8px;
            border: 8px solid #ffffff;
            box-shadow: 0 8px 24px rgba(15, 38, 68, 0.1);
            background: #ffffff;
            image-rendering: auto;
        }

        @media (max-width: 768px) {
            .donate-panel {
                top: auto;
                bottom: 18px;
                right: 12px;
                transform: none;
                width: 188px;
                border-right: 1px solid rgba(255, 255, 255, 0.6);
                border-radius: 20px;
                padding: 0.75rem;
            }
            .donate-panel.collapsed {
                transform: translateX(128px);
            }
            .donate-panel-header {
                font-size: 0.85rem;
                margin-bottom: 0;
            }
            .donate-panel-text {
                font-size: 0.68rem;
                margin-bottom: 0.55rem;
            }
            .donate-qr {
                width: 148px;
                height: 148px;
                border-width: 6px;
            }
        }

        /* 深色模式 - 赞赏 */
        @media (prefers-color-scheme: dark) {
            .donate-panel {
                background: rgba(30, 45, 70, 0.45);
                border-color: rgba(255,255,255,0.12);
            }
            .donate-panel-header { color: #d0dce8; }
            .donate-panel-text { color: #8898a8; }
            .donate-qr {
                border-color: rgba(255,255,255,0.15);
                background: rgba(20, 30, 50, 0.4);
            }
        }
    </style>
</head>
<body>

<!-- 顶部问候 -->
<div class="greeting">
   ⚡️欢迎访问 · 啊游的杂货铺
    <span class="tag">HanDou</span>
</div>

<!-- 主卡片 -->
<div class="main-card" id="mainCard">
    <!-- 骨架屏 -->
    <div class="skeleton-section">
        <div class="skeleton-header">
            <div class="skeleton-dot"></div>
            <div class="skeleton-line title"></div>
        </div>
        <div class="skeleton-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </div>
</div>

<div class="footer-note">
    <a href="admin.html" rel="noopener noreferrer">管理</a>
</div>

<!-- 右侧赞赏悬浮模块 -->
<div class="donate-panel collapsed" id="donatePanel" aria-label="打赏支持">
    <div class="donate-panel-header" onclick="toggleDonatePanel()">
        <div class="donate-panel-title">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span>打赏支持</span>
        </div>
        <span class="donate-toggle-icon">‹</span>
    </div>
    <div class="donate-content">
        <div class="donate-panel-text">微信打开扫一扫</div>
        <img class="donate-qr" src="https://1188188.xyz/handou/png.JPG" alt="微信打赏码">
    </div>
</div>

<!-- 密码弹窗 -->
<div class="password-overlay" id="passwordOverlay" onclick="closePasswordDialogIfOutside(event)">
    <div class="password-dialog" id="passwordDialog" onclick="event.stopPropagation()">
        <h3>🔐 请输入密码</h3>
        <p id="passwordPrompt">此链接受密码保护</p>
        <div class="password-input-wrap">
            <svg class="lock-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="passwordInput" placeholder="输入密码" autocomplete="off">
        </div>
        <div class="password-error" id="passwordError"></div>
        <div class="dialog-buttons">
            <button class="dialog-btn" onclick="closePasswordDialog()">取消</button>
            <button class="dialog-btn confirm" onclick="verifyPassword()">验证</button>
        </div>
    </div>
</div>

<script>
(function() {
    const SUPABASE_URL = 'https://mzxjyupadsakhsceidvm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16eGp5dXBhZHNha2hzY2VpZHZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNDUzNjYsImV4cCI6MjA4NzkyMTM2Nn0.M4sPqp3-oYuw7JlRYmcqnCkLbRPvDYi7O6yMMdPXu88';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let pendingLink = { url: '', password: '' };
    let attemptCount = 0;
    const MAX_ATTEMPTS = 5;
    let lockoutUntil = 0;

    const MODULE_COLORS = ['#7ecfcf', '#f7a8c6', '#a8c8f7'];
    const SECTION_IDS = ['常用', '其他'];
    const STORAGE_KEY = 'handou_fold_state';

    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function getFoldState() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return JSON.parse(saved);
        } catch(e) {}
        return { '安装': true, '相关': true, '收藏': true };
    }

    function saveFoldState(state) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
    }

    function toggleSection(sectionId) {
        const body = document.getElementById('body-' + sectionId);
        const arrow = document.getElementById('arrow-' + sectionId);
        if (!body || !arrow) return;

        const isOpen = body.classList.contains('open');
        if (isOpen) {
            body.style.maxHeight = '0px';
            body.classList.remove('open');
            arrow.classList.remove('open');
        } else {
            body.classList.add('open');
            arrow.classList.add('open');
            body.style.maxHeight = body.scrollHeight + 'px';
        }

        const state = getFoldState();
        state[sectionId] = !isOpen;
        saveFoldState(state);
    }

    // 密码相关
    window.closePasswordDialog = function() {
        document.getElementById('passwordOverlay').classList.remove('active');
        pendingLink = { url: '', password: '' };
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordError').textContent = '';
        document.getElementById('passwordDialog').classList.remove('shake');
    };

    window.closePasswordDialogIfOutside = function(event) {
        if (event.target.classList.contains('password-overlay')) window.closePasswordDialog();
    };

    window.verifyPassword = function() {
        if (Date.now() < lockoutUntil) {
            const remaining = Math.ceil((lockoutUntil - Date.now()) / 1000);
            document.getElementById('passwordError').textContent = `请等待 ${remaining} 秒`;
            return;
        }
        const input = document.getElementById('passwordInput').value;
        if (input && pendingLink.password && input === pendingLink.password) {
            attemptCount = 0;
            if (pendingLink.url) window.open(pendingLink.url, '_blank', 'noopener,noreferrer');
            window.closePasswordDialog();
            return;
        }
        attemptCount++;
        const dialog = document.getElementById('passwordDialog');
        dialog.classList.remove('shake');
        void dialog.offsetWidth;
        dialog.classList.add('shake');
        if (attemptCount >= MAX_ATTEMPTS) {
            lockoutUntil = Date.now() + 30000;
            document.getElementById('passwordError').textContent = '尝试过多，请等 30 秒';
            attemptCount = 0;
        } else {
            document.getElementById('passwordError').textContent = `密码错误（${attemptCount}/${MAX_ATTEMPTS}）`;
        }
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    };

    window.handleProtectedClick = function(event, url, password) {
        event.stopPropagation();
        pendingLink = { url, password };
        document.getElementById('passwordPrompt').innerText = '此链接受密码保护';
        document.getElementById('passwordError').textContent = '';
        document.getElementById('passwordOverlay').classList.add('active');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    };

    window.handleLinkClick = function(event, element) {
        event.stopPropagation();
        const url = element.getAttribute('data-url');
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }
    };

    window.toggleDonatePanel = function() {
        const panel = document.getElementById('donatePanel');
        if (!panel) return;
        panel.classList.toggle('collapsed');
    };


    // ===== 渲染 =====
    function renderSections(links) {
        const mainCard = document.getElementById('mainCard');
        const foldState = getFoldState();

        // 按 category 分组，常用和工具两个模块
        const groups = {};
        SECTION_IDS.forEach(id => groups[id] = []);

        links.forEach(link => {
            let cat = link.category || '默认';
            if (cat === '默认' || cat === '收藏') cat = '常用';
            if (groups[cat]) {
                groups[cat].push(link);
            } else {
                groups['常用'].push(link);
            }
        });

        let html = '';
        SECTION_IDS.forEach((sectionId, idx) => {
            const items = groups[sectionId];
            const color = MODULE_COLORS[idx];
            const isOpen = foldState[sectionId] !== false;
            const count = items.length;

            let linksHtml = '';
            if (count === 0) {
                linksHtml = `<div class="empty-module">暂无链接</div>`;
            } else {
                linksHtml = '<div class="link-grid">';
                items.forEach(link => {
                    const safeUrl = link.url && (link.url.startsWith('http://') || link.url.startsWith('https://')) ? link.url : '#';
                    const hasPassword = link.password && link.password.trim() !== '';
                    const safeTitle = escapeHtml(link.title || '未命名');

                    let iconSvg = link.icon;
                    if (!iconSvg || !iconSvg.includes('<svg')) {
                        iconSvg = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2"/><polyline points="12 5 19 12 12 19" stroke="currentColor" fill="none"/></svg>';
                    } else {
                        iconSvg = iconSvg.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
                    }

                    const clickHandler = hasPassword
                        ? `handleProtectedClick(event, '${escapeHtml(safeUrl)}', '${escapeHtml(link.password).replace(/'/g, "\\'")}')`
                        : `handleLinkClick(event, this)`;

                    linksHtml += `
                        <div class="link-item" data-url="${escapeHtml(safeUrl)}" onclick="${clickHandler}">
                            <span class="item-icon">${iconSvg}</span>
                            <span class="item-text">${safeTitle}</span>
                            ${hasPassword ? '<span class="lock-badge">🔒</span>' : ''}
                        </div>`;
                });
                linksHtml += '</div>';
            }

            html += `
                <div class="section" data-section="${sectionId}">
                    <div class="section-header" onclick="toggleSection('${sectionId}')">
                        <div class="section-dot" style="background: ${color};"></div>
                        <span class="section-title">${escapeHtml(sectionId)}</span>
                        <span class="section-count">${count} 个链接</span>
                        <span class="arrow ${isOpen ? 'open' : ''}" id="arrow-${sectionId}">▶</span>
                    </div>
                    <div class="section-body ${isOpen ? 'open' : ''}" id="body-${sectionId}" style="${isOpen ? '' : 'max-height:0px'}">
                        ${linksHtml}
                    </div>
                </div>`;
        });

        mainCard.innerHTML = html;

        // 展开时重新计算 maxHeight
        SECTION_IDS.forEach(sectionId => {
            const body = document.getElementById('body-' + sectionId);
            if (body && body.classList.contains('open')) {
                body.style.maxHeight = body.scrollHeight + 'px';
            }
        });
    }

    // ===== 初始化 =====
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); window.verifyPassword(); }
        });

        loadLinks();
    });

    async function loadLinks() {
        const mainCard = document.getElementById('mainCard');
        try {
            const { data: links, error } = await supabaseClient
                .from('links')
                .select('*')
                .order('sort_order', { ascending: true });
            if (error) throw error;
            if (!links || links.length === 0) {
                mainCard.innerHTML = '<div style="text-align:center;padding:2rem;color:#62748c;">📭 暂无链接，请去后台添加</div>';
                return;
            }
            renderSections(links);
        } catch (error) {
            console.error('加载失败:', error);
            mainCard.innerHTML = `<div style="text-align:center;padding:2rem;color:#b91c1c;">❌ 加载失败: ${escapeHtml(error.message)}</div>`;
        }
    }
})();
</script>
</body>
</html>
